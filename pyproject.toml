[project]
name = "ea-llm"
version = "0.1.0"
description = "LLM module for the Talkwise English-teaching app: teacher, examiner and reporter roles."
readme = "README.md"
authors = [
    { name = "GenHiegtion", email = "hiengt205716@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
ea-llm = "ea_llm.cli:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.162.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text legitimately contains look-alike chars

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
