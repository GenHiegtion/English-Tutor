    senior: {teacher: cháu, learner: bác}
    unknown: {teacher: mình, learner: bạn}
  switch_greeting: "Chào {learner}, {teacher} là {name} nè! {Teacher} với {learner} học tiếp nha."
  fillers:
    ask_repeat: ["Để {teacher} nghe lại nha.", "Ok, {teacher} nghe nè.", "Nói lại {teacher} nghe thử nha."]
    ask_question: ["Ừm, để {teacher} xem nha.", "Chờ {teacher} xíu nha.", "Hmm, để {teacher} nghĩ chút."]
